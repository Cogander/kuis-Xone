<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Coding | SMP Xaverius 1 Palembang</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Arial,sans-serif}
.hidden{display:none!important}
.option{display:block;padding:14px;margin:10px 0;border:1px solid #475569;border-radius:10px;cursor:pointer}
.option:hover{background:#334155}
.option input{margin-right:10px}
</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">

<header class="bg-indigo-700 p-5 text-center">
<h1 class="text-2xl font-bold">SMP XAVERIUS 1 PALEMBANG</h1>
<p>Coding & Technology Examination</p>
</header>

<main class="max-w-3xl mx-auto p-5">

<section id="registration" class="bg-slate-900 p-6 rounded-xl mt-5">
<h2 class="text-xl font-bold mb-4">Pendaftaran Peserta</h2>
<form id="registrationForm" class="space-y-4">
<input id="firstName" required maxlength="50" placeholder="Nama depan"
class="w-full p-3 rounded text-black">
<input id="lastName" required maxlength="50" placeholder="Nama belakang"
class="w-full p-3 rounded text-black">
<input id="email" type="email" required maxlength="150" placeholder="Email"
class="w-full p-3 rounded text-black">
<button class="w-full bg-indigo-600 p-3 rounded font-bold">
Mulai Ujian
</button>
</form>
<p class="text-slate-400 text-sm mt-4">
25 soal pilihan ganda dan 5 soal esai. Waktu pengerjaan 30 menit.
</p>
</section>

<section id="exam" class="hidden bg-slate-900 p-6 rounded-xl mt-5">
<div class="flex justify-between items-center mb-5">
<span id="progress"></span>
<span id="timer" class="text-yellow-400 font-bold text-xl">30:00</span>
</div>

<div id="questionContainer"></div>

<div class="flex justify-between gap-3 mt-6">
<button id="previous" class="bg-slate-700 px-4 py-3 rounded">
Sebelumnya
</button>
<button id="next" class="bg-indigo-600 px-4 py-3 rounded">
Berikutnya
</button>
<button id="finish" class="hidden bg-green-600 px-4 py-3 rounded">
Kumpulkan
</button>
</div>

<p class="text-slate-400 text-sm mt-5">
Periksa jawaban sebelum mengumpulkan ujian.
</p>
</section>

<section id="result" class="hidden bg-slate-900 p-6 rounded-xl mt-5 text-center">
<h2 class="text-2xl font-bold mb-4">Ujian Selesai</h2>
<p id="resultText" class="text-lg"></p>
<p class="text-slate-400 mt-4">
Nilai esai akan diperiksa oleh guru.
</p>
</section>

</main>

<script>
const questions = [
{type:"pg",category:"Microsoft Word",q:"Microsoft Word digunakan untuk...",o:["Mengolah angka","Mengolah dokumen teks","Mengedit video","Membuat animasi"],a:1},
{type:"pg",category:"Microsoft Word",q:"Shortcut untuk menyimpan dokumen adalah...",o:["Ctrl + P","Ctrl + C","Ctrl + S","Ctrl + V"],a:2},
{type:"pg",category:"Microsoft Word",q:"Shortcut untuk menebalkan teks adalah...",o:["Ctrl + B","Ctrl + I","Ctrl + U","Ctrl + Z"],a:0},
{type:"pg",category:"Microsoft Word",q:"Fitur untuk memiringkan teks disebut...",o:["Bold","Italic","Underline","Align"],a:1},
{type:"pg",category:"Microsoft Word",q:"Ekstensi dokumen Word modern adalah...",o:[".xlsx",".docx",".pptx",".html"],a:1},
{type:"pg",category:"Microsoft Word",q:"Shortcut untuk menyalin teks adalah...",o:["Ctrl + X","Ctrl + V","Ctrl + C","Ctrl + A"],a:2},
{type:"pg",category:"Microsoft Word",q:"Fitur untuk mengatur jarak antarbaris adalah...",o:["Line Spacing","WordArt","Page Color","Find"],a:0},
{type:"pg",category:"Microsoft Word",q:"Perintah untuk membuat teks bergaris bawah adalah...",o:["Bold","Italic","Highlight","Underline"],a:3},
{type:"pg",category:"Microsoft Word",q:"Shortcut untuk mencetak dokumen adalah...",o:["Ctrl + N","Ctrl + P","Ctrl + O","Ctrl + F"],a:1},
{type:"pg",category:"Microsoft Word",q:"Fitur untuk memeriksa ejaan adalah...",o:["Mail Merge","Page Border","Spelling & Grammar","Page Number"],a:2},

{type:"pg",category:"Microsoft Excel",q:"Microsoft Excel terutama digunakan untuk...",o:["Mengedit video","Mengolah data dan angka","Membuat animasi","Mengedit suara"],a:1},
{type:"pg",category:"Microsoft Excel",q:"Pertemuan antara baris dan kolom disebut...",o:["Sheet","Workbook","Cell","Range"],a:2},
{type:"pg",category:"Microsoft Excel",q:"Rumus Excel biasanya diawali dengan tanda...",o:["=","#","&","%"],a:0},
{type:"pg",category:"Microsoft Excel",q:"Fungsi untuk menjumlahkan angka adalah...",o:["COUNT","MAX","AVERAGE","SUM"],a:3},
{type:"pg",category:"Microsoft Excel",q:"Fungsi untuk menghitung rata-rata adalah...",o:["MIN","AVERAGE","SUM","IF"],a:1},
{type:"pg",category:"Microsoft Excel",q:"Kolom pada Excel ditandai dengan...",o:["Angka","Simbol","Huruf","Warna"],a:2},
{type:"pg",category:"Microsoft Excel",q:"Baris pada Excel ditandai dengan...",o:["Angka","Huruf","Simbol","Warna"],a:0},
{type:"pg",category:"Microsoft Excel",q:"Fungsi untuk mencari nilai terbesar adalah...",o:["MIN","SUM","COUNT","MAX"],a:3},
{type:"pg",category:"Microsoft Excel",q:"Ekstensi file Excel modern adalah...",o:[".docx",".xlsx",".pptx",".txt"],a:1},
{type:"pg",category:"Microsoft Excel",q:"Rumus yang benar untuk menjumlahkan A1 sampai A5 adalah...",o:["=ADD(A1:A5)","=TOTAL(A1:A5)","=SUM(A1:A5)","=PLUS(A1:A5)"],a:2},

{type:"pg",category:"VS Code, HTML, Python",q:"Visual Studio Code adalah aplikasi untuk...",o:["Membuat dan mengedit kode","Mengolah angka saja","Membuat presentasi saja","Mengedit foto saja"],a:0},
{type:"pg",category:"VS Code, HTML, Python",q:"HTML digunakan untuk...",o:["Mengolah database saja","Mengatur perangkat keras","Menyusun struktur halaman web","Membuat sistem operasi"],a:2},
{type:"pg",category:"VS Code, HTML, Python",q:"Tag HTML untuk membuat judul utama adalah...",o:["<p>","<h1>","<img>","<br>"],a:1},
{type:"pg",category:"VS Code, HTML, Python",q:"Ekstensi file Python adalah...",o:[".html",".css",".js",".py"],a:3},
{type:"pg",category:"VS Code, HTML, Python",q:"Perintah Python untuk menampilkan teks adalah...",o:["print()","show()","echo()","displayText()"],a:0},

{type:"essay",category:"Esai HTML",q:"Jelaskan pengertian HTML dan fungsinya dalam pembuatan website!"},
{type:"essay",category:"Esai HTML",q:"Tuliskan struktur dasar dokumen HTML yang benar!"},
{type:"essay",category:"Esai HTML",q:"Jelaskan perbedaan tag <head> dan <body>!"},
{type:"essay",category:"Esai HTML",q:'Tuliskan kode HTML untuk menampilkan judul "Website Saya" dan paragraf "Selamat datang di website saya"!'},
{type:"essay",category:"Esai HTML",q:"Jelaskan fungsi tag <a>, <img>, dan <p> dalam HTML!"}
];

let current = 0;
let answers = {};
let remaining = 1800;
let timerInterval;
let participant = {};
let submitted = false;

const $ = id => document.getElementById(id);

$("registrationForm").addEventListener("submit", function(e) {
 e.preventDefault();

 participant = {
  firstName:$("firstName").value.trim(),
  lastName:$("lastName").value.trim(),
  email:$("email").value.trim()
 };

 if (!participant.firstName || !participant.lastName || !participant.email) return;

 $("registration").classList.add("hidden");
 $("exam").classList.remove("hidden");

 renderQuestion();

 timerInterval = setInterval(() => {
  remaining--;
  $("timer").textContent =
   String(Math.floor(remaining/60)).padStart(2,"0")+":"+
   String(remaining%60).padStart(2,"0");

  if (remaining <= 0) submitExam();
 },1000);
});

function renderQuestion() {
 const q = questions[current];
 $("progress").textContent = `Soal ${current+1} dari ${questions.length}`;

 const container = $("questionContainer");
 container.replaceChildren();

 const heading = document.createElement("p");
 heading.className = "text-sm text-indigo-300 mb-2";
 heading.textContent = q.category;
 container.appendChild(heading);

 const title = document.createElement("h2");
 title.className = "text-xl font-bold mb-5";
 title.textContent = q.q;
 container.appendChild(title);

 if (q.type === "pg") {
  q.o.forEach((option,index) => {
   const label = document.createElement("label");
   label.className = "option";

   const radio = document.createElement("input");
   radio.type = "radio";
   radio.name = "answer";
   radio.value = index;
   radio.checked = answers[current] === index;
   radio.addEventListener("change", () => answers[current] = index);

   label.append(radio,document.createTextNode(
    String.fromCharCode(65+index)+". "+option
   ));
   container.appendChild(label);
  });
 } else {
  const textarea = document.createElement("textarea");
  textarea.className = "w-full p-3 rounded text-black";
  textarea.rows = 7;
  textarea.maxLength = 5000;
  textarea.placeholder = "Tuliskan jawaban esai...";
  textarea.value = answers[current] || "";
  textarea.addEventListener("input", () => answers[current] = textarea.value);
  container.appendChild(textarea);
 }

 $("previous").disabled = current === 0;
 $("previous").classList.toggle("opacity-50",current === 0);
 $("next").classList.toggle("hidden",current === questions.length-1);
 $("finish").classList.toggle("hidden",current !== questions.length-1);
}

$("previous").addEventListener("click",() => {
 if(current > 0) { current--; renderQuestion(); }
});

$("next").addEventListener("click",() => {
 if(current < questions.length-1) { current++; renderQuestion(); }
});

$("finish").addEventListener("click",() => {
 if(confirm("Apakah kamu yakin ingin mengumpulkan ujian?")) submitExam();
});

function submitExam() {
 if(submitted) return;
 submitted = true;
 clearInterval(timerInterval);

 let score = 0;
 let totalPG = 0;

 questions.forEach((q,index) => {
  if(q.type === "pg") {
   totalPG++;
   if(answers[index] === q.a) score++;
  }
 });

 const result = {
  participant,
  answers,
  score,
  totalPG,
  submittedAt:new Date().toISOString()
 };

 /*
   DEMO LOKAL:
   Data disimpan pada browser yang digunakan.
   Untuk sistem online yang aman, hubungkan ke Supabase
   dan lakukan penilaian melalui backend.
 */
 try {
  const key = "xaverius_quiz_demo";
  const data = JSON.parse(localStorage.getItem(key) || "[]");
  data.push(result);
  localStorage.setItem(key,JSON.stringify(data));
 } catch(error) {
  alert("Penyimpanan lokal gagal.");
 }

 $("exam").classList.add("hidden");
 $("result").classList.remove("hidden");
 $("resultText").textContent =
  `Nilai pilihan ganda: ${score}/${totalPG} (${Math.round(score/totalPG*100)}%). Esai menunggu penilaian guru.`;
}
</script>
</body>
  </html>
