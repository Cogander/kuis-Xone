
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Xone - Peserta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f8fafc;font-family:Arial,sans-serif}
header{background:#4338ca;text-align:center;padding:24px}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:#1e293b;padding:22px;border-radius:14px;margin-bottom:18px}
input,textarea{width:100%;padding:12px;margin:8px 0 15px;border:0;border-radius:7px;font-size:16px}
button{background:#4f46e5;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5}
.option{display:block;padding:12px;background:#334155;border-radius:8px;margin:9px 0;cursor:pointer}
.option input{width:auto;margin:0 10px 0 0}
.hidden{display:none}
#timer{font-size:22px;color:#facc15;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>SMP XAVERIUS 1 PALEMBANG</h1>
<p>CODING & TECHNOLOGY QUIZ</p>
</header>
<main>
<section id="register" class="card">
<h2>Pendaftaran Peserta</h2>
<label>Nama depan</label><input id="first" required>
<label>Nama belakang</label><input id="last" required>
<label>Email</label><input id="email" type="email" required>
<button onclick="startExam()">Mulai Ujian</button>
<p>25 Pilihan Ganda + 5 Esai HTML | Waktu 30 menit</p>
</section>

<section id="exam" class="hidden">
<div class="card">
<span id="progress"></span>
<span id="timer" style="float:right">30:00</span>
</div>
<div class="card">
<div id="question"></div>
<div style="display:flex;justify-content:space-between;margin-top:20px">
<button id="prev" onclick="move(-1)">Sebelumnya</button>
<button id="next" onclick="move(1)">Berikutnya</button>
<button id="finish" class="hidden" onclick="finish()">Kumpulkan</button>
</div>
</div>
</section>

<section id="done" class="card hidden">
<h2>Ujian berhasil dikirim!</h2>
<p>Jawaban kamu telah disimpan. Terima kasih telah mengikuti ujian.</p>
</section>
<p id="message"></p>
</main>

<script>
const URL="https://qqvqcvhcpjrmoynkmizb.supabase.co";
const KEY="TEMPELKAN_PUBLISHABLE_KEY_DI_SINI";
const db=supabase.createClient(URL,KEY);

const questions=[
["MS Word","Microsoft Word digunakan untuk ...",["Mengolah dokumen teks","Mengolah angka","Mengedit video","Membuat animasi"],0],
["MS Word","Shortcut menyimpan dokumen adalah ...",["Ctrl + P","Ctrl + S","Ctrl + C","Ctrl + V"],1],
["MS Word","Shortcut menebalkan teks adalah ...",["Ctrl + B","Ctrl + I","Ctrl + U","Ctrl + Z"],0],
["MS Word","Fitur untuk memiringkan teks disebut ...",["Bold","Italic","Underline","Align"],1],
["MS Word","Ekstensi dokumen Word modern adalah ...",[".xlsx",".docx",".pptx",".html"],1],
["MS Word","Shortcut menyalin teks adalah ...",["Ctrl + X","Ctrl + V","Ctrl + C","Ctrl + A"],2],
["MS Word","Mengatur jarak antarbaris menggunakan ...",["Line Spacing","WordArt","Page Color","Find"],0],
["MS Word","Membuat teks bergaris bawah menggunakan ...",["Bold","Italic","Highlight","Underline"],3],
["MS Word","Shortcut mencetak dokumen adalah ...",["Ctrl + N","Ctrl + P","Ctrl + O","Ctrl + F"],1],
["MS Word","Fitur pemeriksa ejaan adalah ...",["Mail Merge","Page Border","Spelling & Grammar","Page Number"],2],
["MS Excel","Excel terutama digunakan untuk ...",["Mengedit video","Mengolah data dan angka","Membuat animasi","Mengedit suara"],1],
["MS Excel","Pertemuan baris dan kolom disebut ...",["Sheet","Workbook","Cell","Range"],2],
["MS Excel","Rumus Excel diawali tanda ...",["=","#","&","%"],0],
["MS Excel","Fungsi penjumlahan adalah ...",["COUNT","MAX","AVERAGE","SUM"],3],
["MS Excel","Fungsi menghitung rata-rata adalah ...",["MIN","AVERAGE","SUM","IF"],1],
["MS Excel","Kolom Excel ditandai dengan ...",["Angka","Simbol","Huruf","Warna"],2],
["MS Excel","Baris Excel ditandai dengan ...",["Angka","Huruf","Simbol","Warna"],0],
["MS Excel","Fungsi mencari nilai terbesar adalah ...",["MIN","SUM","COUNT","MAX"],3],
["MS Excel","Ekstensi file Excel modern adalah ...",[".docx",".xlsx",".pptx",".txt"],1],
["MS Excel","Rumus menjumlahkan A1 sampai A5 adalah ...",["=ADD(A1:A5)","=TOTAL(A1:A5)","=SUM(A1:A5)","=PLUS(A1:A5)"],2],
["VS Code, HTML, Python","Visual Studio Code digunakan untuk ...",["Membuat dan mengedit kode","Mengolah angka saja","Presentasi saja","Mengedit foto saja"],0],
["VS Code, HTML, Python","HTML digunakan untuk ...",["Mengolah database saja","Mengatur perangkat keras","Menyusun struktur halaman web","Membuat sistem operasi"],2],
["VS Code, HTML, Python","Tag HTML untuk judul utama adalah ...",["<p>","<h1>","<img>","<br>"],1],
["VS Code, HTML, Python","Ekstensi file Python adalah ...",[".html",".css",".js",".py"],3],
["VS Code, HTML, Python","Perintah Python menampilkan teks adalah ...",["print()","show()","echo()","displayText()"],0]
];

const essays=[
"Jelaskan pengertian HTML dan fungsinya dalam pembuatan website!",
"Jelaskan perbedaan tag <head> dan <body>!",
"Tuliskan struktur dasar dokumen HTML!",
"Bagaimana kode HTML untuk membuat judul Website Saya dan paragraf Selamat Datang?",
"Jelaskan fungsi tag <a>, <img>, dan <p>!"
];

let participant={},answers={},position=0,seconds=1800,timer=null,finished=false;

const $=id=>document.getElementById(id);

function startExam(){
 const first=$("first").value.trim(),last=$("last").value.trim(),email=$("email").value.trim();
 if(!first||!last||!email){alert("Lengkapi semua data.");return}
 participant={first,last,email};
 $("register").classList.add("hidden");
 $("exam").classList.remove("hidden");
 render();
 timer=setInterval(()=>{
  seconds--;
  $("timer").textContent=Math.floor(seconds/60).toString().padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
  if(seconds<=0)finish();
 },1000);
}

function render(){
 const root=$("question");root.replaceChildren();
 $("progress").textContent="Soal "+(position+1)+" dari 30";
 if(position<25){
  const q=questions[position];
  const h=document.createElement("h3");h.textContent=q[0];root.appendChild(h);
  const p=document.createElement("p");p.textContent=(position+1)+". "+q[1];root.appendChild(p);
  q[2].forEach((option,i)=>{
   const label=document.createElement("label");label.className="option";
   const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.checked=answers[position]===i;
   radio.onchange=()=>answers[position]=i;
   label.append(radio,document.createTextNode(String.fromCharCode(65+i)+". "+option));root.appendChild(label);
  });
 }else{
  const i=position-25;
  const h=document.createElement("h3");h.textContent="Esai HTML";root.appendChild(h);
  const p=document.createElement("p");p.textContent=(position+1)+". "+essays[i];root.appendChild(p);
  const area=document.createElement("textarea");area.rows=7;area.maxLength=5000;area.placeholder="Tuliskan jawaban...";
  area.value=answers[position]||"";
  area.oninput=()=>answers[position]=area.value;
  root.appendChild(area);
 }
 $("prev").disabled=position===0;
 $("next").classList.toggle("hidden",position===29);
 $("finish").classList.toggle("hidden",position!==29);
}

function move(n){
 position=Math.max(0,Math.min(29,position+n));render();
}

async function finish(){
 if(finished)return;
 const missing=[];
 for(let i=0;i<25;i++)if(answers[i]===undefined)missing.push(i+1);
 for(let i=25;i<30;i++)if(!String(answers[i]||"").trim())missing.push(i+1);
 if(missing.length&&seconds>0){
  alert("Soal belum dijawab: "+missing.join(", "));
  return;
 }
 if(seconds>0&&!confirm("Kumpulkan semua jawaban?"))return;
 finished=true;clearInterval(timer);
 $("finish").disabled=true;
 $("message").textContent="Mengirim jawaban ke database...";
 const score=questions.reduce((sum,q,i)=>sum+(answers[i]===q[3]?1:0),0);
 const essayAnswers=essays.map((_,i)=>answers[i+25]||"");
 const {error}=await db.from("hasil_ujian").insert({
  nama_depan:participant.first,nama_belakang:participant.last,
  email:participant.email,nilai_pg:score,total_pg:25,
  jawaban_pg:Object.fromEntries(questions.map((_,i)=>[i,answers[i]??null])),
  jawaban_esai:essayAnswers
 });
 if(error){
  finished=false;$("finish").disabled=false;
  $("message").textContent="Gagal mengirim: "+error.message;
  return;
 }
 $("exam").classList.add("hidden");$("done").classList.remove("hidden");
 $("message").textContent="";
}
</script>
</body>
</html>
