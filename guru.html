
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Xone - Dashboard Guru</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#101827;color:white;margin:0}
header{background:#4338ca;padding:25px;text-align:center}
main{max-width:1100px;margin:25px auto;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:18px}
input,textarea{width:100%;padding:12px;margin:8px 0 15px;border:0;border-radius:7px}
button{background:#4f46e5;color:white;border:0;padding:11px 17px;border-radius:7px;cursor:pointer;margin:3px}
table{width:100%;border-collapse:collapse;min-width:650px}
td,th{padding:12px;border-bottom:1px solid #475569;text-align:left}
.wrap{overflow-x:auto}
.hidden{display:none}
.answer{background:#334155;padding:12px;border-radius:7px;margin:10px 0}
</style>
</head>
<body>
<header>
<h1>SMP XAVERIUS 1 PALEMBANG</h1>
<p>DASHBOARD GURU - KUIS XONE</p>
</header>
<main>
<section id="login" class="card">
<h2>Login Guru</h2>
<label>Email</label>
<input id="email" type="email" placeholder="Email guru">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Masuk Dashboard</button>
<p id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Dashboard Hasil Ujian</h2>
<button onclick="loadResults()">Refresh Data</button>
<button onclick="logout()">Logout</button>
<p id="count">Memuat data...</p>
<div class="wrap">
<table>
<thead><tr>
<th>Nama</th><th>Email</th><th>Nilai PG</th>
<th>Nilai Esai</th><th>Waktu</th><th>Detail</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>

<div id="detail" class="card hidden">
<h2>Detail Jawaban</h2>
<div id="detailContent"></div>
</div>
</section>
</main>

<script>
const URL="https://qqvqcvhcpjrmoynkmizb.supabase.co";
const KEY="TEMPELKAN_PUBLISHABLE_KEY_DI_SINI";
const db=supabase.createClient(URL,KEY);
let results=[];

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMessage");
 msg.textContent="Memeriksa akun...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent="Login gagal: "+error.message;return}
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 loadResults();
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
}

async function loadResults(){
 const {data,error}=await db.from("hasil_ujian").select("*").order("waktu_pengumpulan",{ascending:false});
 if(error){alert("Gagal mengambil data: "+error.message);return}
 results=data||[];
 document.getElementById("count").textContent="Jumlah peserta: "+results.length;
 const tbody=document.getElementById("rows");tbody.replaceChildren();
 results.forEach((r,i)=>{
  const tr=document.createElement("tr");
  const values=[
   r.nama_depan+" "+r.nama_belakang,r.email,
   r.nilai_pg+"/25",
   r.nilai_esai===null?"Belum dinilai":r.nilai_esai+"/100",
   new Date(r.waktu_pengumpulan).toLocaleString("id-ID")
  ];
  values.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
  const td=document.createElement("td"),btn=document.createElement("button");
  btn.textContent="Lihat";btn.onclick=()=>showDetail(i);
  td.appendChild(btn);tr.appendChild(td);tbody.appendChild(tr);
 });
}

function showDetail(index){
 const r=results[index],root=document.getElementById("detailContent");
 root.replaceChildren();
 const heading=document.createElement("h3");
 heading.textContent=r.nama_depan+" "+r.nama_belakang+" ("+r.email+")";
 root.appendChild(heading);
 const score=document.createElement("p");
 score.textContent="Nilai pilihan ganda: "+r.nilai_pg+"/25";
 root.appendChild(score);

 const essayQuestions=[
 "Jelaskan pengertian HTML dan fungsinya dalam pembuatan website!",
 "Jelaskan perbedaan tag <head> dan <body>!",
 "Tuliskan struktur dasar dokumen HTML!",
 "Bagaimana kode HTML untuk membuat judul Website Saya dan paragraf Selamat Datang?",
 "Jelaskan fungsi tag <a>, <img>, dan <p>!"
 ];
 const answers=Array.isArray(r.jawaban_esai)?r.jawaban_esai:[];
 essayQuestions.forEach((question,i)=>{
  const box=document.createElement("div");box.className="answer";
  const h=document.createElement("h4");h.textContent="Esai "+(i+1)+": "+question;
  const p=document.createElement("p");p.textContent=answers[i]||"Tidak dijawab";
  box.append(h,p);root.appendChild(box);
 });

 const label=document.createElement("label");
 label.textContent="Nilai esai keseluruhan (0-100)";
 const input=document.createElement("input");
 input.type="number";input.min="0";input.max="100";
 input.value=r.nilai_esai??"";
 input.id="essayScore";
 const button=document.createElement("button");
 button.textContent="Simpan Nilai Esai";
 button.onclick=()=>saveScore(r.id);
 root.append(label,input,button);
 document.getElementById("detail").classList.remove("hidden");
 document.getElementById("detail").scrollIntoView({behavior:"smooth"});
}

async function saveScore(id){
 const score=Number(document.getElementById("essayScore").value);
 if(!Number.isInteger(score)||score<0||score>100){
  alert("Masukkan nilai antara 0 sampai 100.");return;
 }
 const {error}=await db.from("hasil_ujian")
 .update({nilai_esai:score,status_esai:"Sudah dinilai"}).eq("id",id);
 if(error){alert("Gagal menyimpan nilai: "+error.message);return}
 alert("Nilai esai berhasil disimpan!");
 document.getElementById("detail").classList.add("hidden");
 loadResults();
}

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadResults();
 }
})();
</script>
</body>
</html>
